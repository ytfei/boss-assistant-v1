name: Build Chrome Extension

# 触发时机：
#   - 推送到 main        → 跑测试 + 打包，产物作为 Artifact 供下载
#   - 推送 v* 标签        → 跑测试 + 打包 + 发布 GitHub Packages + 创建 GitHub Release
#   - 面向 main 的 PR     → 只跑测试，校验纯函数算法没被改坏
#   - 手动触发           → 随时可从 Actions 页面跑一次
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 创建 Release
  packages: write # 发布到 GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # registry-url 会生成 .npmrc，指向 GitHub Packages 并用 GITHUB_TOKEN 鉴权
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      # 版本号以 manifest.json 为准，避免两处维护
      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "插件版本：$VERSION"

      # 移植过来的纯函数算法最容易写错，打包前先跑一遍
      - name: Run tests
        run: node tests/run.js

      # Chrome 扩展的 zip 必须把 manifest.json 放在根目录；
      # 只打包运行所需文件（manifest.json + src + icons + LICENSE），
      # 不包含 tests / README / assets / .github，保持加载包干净。
      # ⚠️ icons 必须打进去：manifest.json 的 icons 字段引用了它，缺了会加载失败。
      - name: Package extension
        id: pack
        run: |
          NAME="boss-assistant-v${{ steps.meta.outputs.version }}"
          mkdir -p dist
          zip -r "dist/${NAME}.zip" manifest.json src icons LICENSE
          echo "zip=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "生成：dist/${NAME}.zip"
          unzip -l "dist/${NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-assistant-extension-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      # 只有推 v* 标签才发布，避免 main 分支每次提交都产生新版本
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages 要求包名 scoped 到仓库 owner；用动态值让 fork 也能发布到自己名下
          npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/boss-assistant"
          npm pkg set version="${{ steps.meta.outputs.version }}"
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}.git"

          # 版本已存在则跳过，避免重复推送同一个 tag 时任务变红
          if npm view "@${GITHUB_REPOSITORY_OWNER}/boss-assistant@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "版本 ${{ steps.meta.outputs.version }} 已存在于 GitHub Packages，跳过发布"
          else
            npm publish
          fi

      # 只有推 v* 标签时才发布 Release；main 分支的构建只留 Artifact
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
